[project]
name = "macro-regime-taa"
version = "0.1.0"
description = "Macro regime research engine using growth and inflation signals for tactical asset allocation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "plotly>=5.18",
    "streamlit>=1.30",
    "typer>=0.9",
    "rich>=13.7",
    "pyyaml>=6.0",
    "yfinance>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "responses>=0.24",
    "ruff>=0.1.9",
    "mypy>=1.7",
    "pandas-stubs",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
macro-regime = "macro_regime.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macro_regime"]

[tool.poetry]
# Package metadata (name, version, description, etc.) stays in [project]
# above (Poetry 2.x PEP 621 interop). This section exists only to point
# Poetry's package discovery at the actual src-layout package -- without
# it, Poetry infers the package dir from the project name
# ("macro-regime-taa" -> "macro_regime_taa") and fails with
# "No file/folder found for package macro-regime-taa" (the error seen on
# Streamlit Community Cloud). The real package lives at src/macro_regime.
packages = [
    { include = "macro_regime", from = "src" }
]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = [".analysis"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
namespace_packages = true
explicit_package_bases = true
exclude = ["^app/", "^tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
