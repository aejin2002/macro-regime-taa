# macro-regime-taa default configuration
# All series IDs, lags, and thresholds used across the pipeline are defined here
# so behavior can be audited and changed without touching code.

fred:
  base_url: "https://api.stlouisfed.org/fred"
  timeout_seconds: 15
  max_retries: 3
  backoff_seconds: 1.5

# Growth target + confirmation series
series:
  growth:
    INDPRO: { title: "Industrial Production Index", frequency: "m", units: "Index" }
    CFNAI: { title: "Chicago Fed National Activity Index", frequency: "m", units: "Index" }
    CFNAIMA3: { title: "Chicago Fed National Activity Index, 3-Month Moving Average", frequency: "m", units: "Index" }
    ICSA: { title: "Initial Claims", frequency: "w", units: "Number" }
    PERMIT: { title: "New Private Housing Units Authorized by Building Permits", frequency: "m", units: "Thousands" }
    USPHCI: { title: "Coincident Economic Activity Index for the United States", frequency: "m", units: "Index" }
    USALOLITOAASTSAM: { title: "OECD Composite Leading Indicator, United States, Amplitude Adjusted", frequency: "m", units: "Index" }
    AMTMNO: { title: "Manufacturers' New Orders: Total Manufacturing", frequency: "m", units: "Millions of Dollars" }
  inflation:
    CPILFESL: { title: "Core CPI, Seasonally Adjusted", frequency: "m", units: "Index" }
    PCEPILFE: { title: "Core PCE Price Index", frequency: "m", units: "Index" }
    CPIAUCSL: { title: "Headline CPI, Seasonally Adjusted", frequency: "m", units: "Index" }
    MEDCPIM158SFRBCLE: { title: "Median CPI (Cleveland Fed)", frequency: "m", units: "Percent" }
    PALLFNFINDEXM: { title: "Global Price Index of All Commodities (IMF)", frequency: "m", units: "Index" }
  diagnostics:
    T10Y3M: { title: "10-Year Treasury Minus 3-Month Treasury", frequency: "d", units: "Percent" }
    T10Y2Y: { title: "10-Year Treasury Minus 2-Year Treasury", frequency: "d", units: "Percent" }
    T5YIE: { title: "5-Year Breakeven Inflation Rate", frequency: "d", units: "Percent" }
    DGS10: { title: "10-Year Treasury Constant Maturity Rate", frequency: "d", units: "Percent" }
    T10YIE: { title: "10-Year Breakeven Inflation Rate", frequency: "d", units: "Percent" }
    VIXCLS: { title: "CBOE Volatility Index (VIX)", frequency: "d", units: "Index" }

# NOTE: FRED's USSLIND is the Philadelphia Fed "State Leading Indexes" derived
# national series, discontinued after 2020. It is NOT the Conference Board LEI.
# The Conference Board LEI must be supplied via data/external/conference_board_lei.csv.
# Legacy/optional external CSVs. None of the core models (Model A, Model B --
# see growth_models/inflation_models below) depend on these. They only feed
# legacy/proxy models that are kept for baseline comparison:
# model_c_simple_two_signal (growth), model_b_leading_composite (inflation).
# Core operational models use FRED-auto-fetched data exclusively.
conference_board_lei_csv: "data/external/conference_board_lei.csv"
ism_new_orders_csv: "data/external/ism_new_orders.csv"
ism_prices_paid_csv: "data/external/ism_prices_paid.csv"

growth_models:
  model_a_cli:
    us_series: "USALOLITOAASTSAM"
    change_windows_months: [1, 3, 6]
    primary_window_months: 3
    stabilization_windows_months: [3, 6]
  model_b_fred_minimal:
    claims_series: "ICSA"
    claims_change_months: 3
    claims_monthly_average: true
    permits_series: "PERMIT"
    permits_change_months: 6
    activity_series: "CFNAIMA3"
  model_c_simple_two_signal:
    ism_new_orders_change_months: 3
    claims_series: "ICSA"
    claims_change_months: 3
  model_d_amtmno_claims:
    amtmno_series: "AMTMNO"
    amtmno_change_months: 3
    claims_series: "ICSA"
    claims_change_months: 3

inflation_models:
  model_a_realized_core:
    core_series: "CPILFESL"
    short_window_months: 3
    long_window_months: 12
  model_b_leading_composite:
    breakeven_series: "T5YIE"
    breakeven_change_months: 3
    core_series: "CPILFESL"
  model_c_cleveland_median_cpi:
    median_cpi_series: "MEDCPIM158SFRBCLE"
    ma_window_months: 3
    lag_months: 3
  model_d_commodity_core_aux:
    commodity_series: "PALLFNFINDEXM"
    commodity_change_months: 3
    core_series: "CPILFESL"

# Growth Asset Basket: the regime engine above classifies a single US
# Growth x US Inflation regime (see docs/methodology.md). When the growth
# axis is "Up", it is spent on this fixed-weight basket rather than a
# single asset or a separate per-country regime. Finalized for the v1.0
# backtest: SPY 60% + KODEX 200 ETF (069500.KS, a real KOSPI 200-tracking
# fund, KRW-denominated) 40%, converted to USD via month-end KRW=X.
# Rebalanced monthly wherever used inside a regime/static/equal-weight
# strategy; NOT rebalanced in the standalone "Growth Basket buy-and-hold"
# comparison strategy (see docs/methodology.md, "Backtest").
growth_basket:
  spy_weight: 0.6
  kodex200_weight: 0.4
  kodex200_ticker: "069500.KS"
  fx_ticker: "KRW=X"

# Standard asset-allocation regime output. Frozen as of commit 40e43d7 --
# no further indicator search or formula tuning. Both use Core Inflation
# Momentum (model_a_realized_core) as the shared inflation axis; see
# docs/methodology.md for why it is treated as a current-environment
# classifier, not a strong short-term predictor. Cleveland Median CPI and
# the commodity+core auxiliary model are explicitly excluded here -- they
# remain auxiliary/research-only, never promoted into this output.
regime_output:
  primary:
    growth_model: "model_a_cli"
    inflation_model: "model_a_realized_core"
  secondary:
    growth_model: "model_d_amtmno_claims"
    inflation_model: "model_a_realized_core"
  tradable_lag_months: 1

# v1.0 fixed-regime asset allocation backtest. Weights below are used
# exactly as given -- not optimized, not fit to data. See
# docs/methodology.md, "Backtest", for the full ruleset (monthly
# rebalance to target, one-way turnover x transaction_cost_bps,
# tradable_regime-only, common-start-date, no-forward-fill).
backtest:
  transaction_cost_bps: 10
  risk_free_asset: "tbills"
  assets:
    spy: "SPY"
    high_yield: "HYG"
    investment_grade: "LQD"
    intermediate_treasury: "IEF"
    long_treasury: "TLT"
    gold: "GLD"
    tbills: "BIL"
    commodities: "DBC"
    tips: "TIP"
  regime_allocations:
    GOLDILOCKS:
      growth_basket: 0.60
      high_yield: 0.10
      investment_grade: 0.10
      intermediate_treasury: 0.10
      gold: 0.05
      tbills: 0.05
    REFLATION:
      growth_basket: 0.40
      commodities: 0.20
      tips: 0.15
      gold: 0.10
      high_yield: 0.10
      tbills: 0.05
    STAGFLATION:
      growth_basket: 0.10
      commodities: 0.25
      gold: 0.25
      tips: 0.20
      tbills: 0.20
    CONTRACTION:
      long_treasury: 0.35
      intermediate_treasury: 0.20
      investment_grade: 0.15
      tbills: 0.20
      gold: 0.10
    UNKNOWN:
      tbills: 1.00
  static_6040:
    growth_basket: 0.60
    intermediate_treasury: 0.40

# Product release versions ("Macro Regime TAA v1.2" / "v1.3") -- NOT the
# same axis as the v1_0/v1_1/v1_2 overlay-stack labels used inside
# fast_crisis/backtest.py (Macro-only -> +BEI -> +Fast Crisis). This
# section only ever changes the REGIME ALLOCATION TABLE a release uses;
# BEI Duration Gate, Fast Crisis, signal thresholds, execution lag, and
# transaction costs are identical across every release. v1.2 is the
# table above (`backtest.regime_allocations`), frozen and immutable.
# v1.3 ("Growth Participation", adopted after the Candidate "Both +5"
# robustness study in `.analysis/growth_participation_robustness/`)
# overrides ONLY GOLDILOCKS and REFLATION -- Growth Basket +5pp funded
# entirely from tbills, every other weight and every other regime
# (STAGFLATION/CONTRACTION/UNKNOWN) unchanged. See
# `macro_regime.strategy_versions.build_versioned_config`, the only code
# that reads this section.
strategy_versions:
  default_production_version: "v1_3"
  v1_3:
    regime_allocation_overrides:
      GOLDILOCKS:
        growth_basket: 0.65
        high_yield: 0.10
        investment_grade: 0.10
        intermediate_treasury: 0.10
        gold: 0.05
        tbills: 0.00
      REFLATION:
        growth_basket: 0.45
        commodities: 0.20
        tips: 0.15
        gold: 0.10
        high_yield: 0.10
        tbills: 0.00

# v1.1 BEI Duration Risk Gate -- see docs/methodology.md, "BEI Duration
# Risk Gate (v1.1)". Only tilts the nominal-Treasury duration sleeve
# (intermediate_treasury + long_treasury) of the Primary v1.0 regime
# allocation; the macro regime itself and every other asset are
# untouched. Thresholds/split below are an ex-ante heuristic fixed
# before running any backtest -- not fit or tuned to past performance.
bei_duration_gate:
  ief_weight_when_on: 0.30
  bil_weight_when_on: 0.70

# v1.2 Fast Crisis Overlay -- see docs/methodology.md, "Fast Crisis
# Overlay (v1.2)". A daily-frequency, 2-of-3-signal tail-risk brake on
# top of Primary v1.0 + BEI Duration Risk Gate (v1.1). Fires on VIX,
# SPY, and HYG shocks; never changes the macro regime, the BEI gate, or
# LQD/IEF/TLT/GLD/TIP. All thresholds below are ex-ante heuristics fixed
# before any backtest was run and were not re-tuned after seeing results
# (see Phase A verification in the delivery record for this feature).
fast_crisis:
  vix_threshold: 30.0
  vix_ma_window_days: 20
  vix_ma_ratio_threshold: 0.50
  equity_shock_window_days: 5
  equity_shock_threshold: -0.07
  credit_shock_window_days: 5
  credit_shock_threshold: -0.03
  min_hold_days: 10
  min_off_days_to_exit: 5

zscore:
  min_periods_months: 60
  rolling_window_months: 120
  ddof: 1
  winsorize: false

lookahead:
  monthly_macro_lag_months: 1
  daily_market_lag_days: 1
  effective_from: "next_trading_day_of_month_after_signal_month"

evaluation:
  growth_target_series: "INDPRO"
  growth_horizons_months: [3, 6]
  inflation_target_series: "CPILFESL"
  inflation_horizons_months: [3, 6]
  naive_baselines: ["always_up", "always_down"]

default_start_date: "1990-01-01"
